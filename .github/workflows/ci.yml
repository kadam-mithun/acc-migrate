name: ci
on: [pull_request, push]
permissions:
  contents: read
  id-token: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: for s in servers/*-mcp; do (cd "$s" && uv sync --frozen && uv run ruff check . && uv run mypy --strict src && uv run pytest -q --cov=src --cov-fail-under=80); done
      # Logging discipline rule (c): no non-static log event strings. Rules (a)
      # `print` and (b) stdlib `logging` are ruff T20/TID251, already covered by
      # `ruff check .` above. Stdlib-only, so it needs no venv.
      - run: |
          for s in servers/*-mcp; do
            if [ -f "$s/tools/check_log_calls.py" ]; then
              (cd "$s" && python3 tools/check_log_calls.py src spark_jobs tests) || exit 1
            fi
          done
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - uses: gitleaks/gitleaks-action@v2
      - uses: returntocorp/semgrep-action@v1
        with: { config: "p/python p/secrets" }
      # Mechanical no-write gate (SPEC §10, §14 row 27; root rule 2). Call sites
      # via semgrep, module boundaries via import-linter. Each server ships its
      # own policies/, so the loop skips servers that have none yet.
      - run: |
          for s in servers/*-mcp; do
            if [ -f "$s/policies/nowrite.semgrep.yml" ]; then
              (cd "$s" && uvx semgrep --quiet --config policies/nowrite.semgrep.yml \
                 --error src spark_jobs tools) || exit 1
            fi
            if [ -f "$s/policies/.importlinter" ]; then
              (cd "$s" && uv sync --frozen --extra dev \
                 && PYTHONPATH=src uv run lint-imports --config policies/.importlinter) || exit 1
            fi
          done
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: 1 }
      # Two steps, not one glob: the action passes `directory` straight to
      # checkov's --directory, which does not expand shell globs. `servers/`
      # is scanned recursively, so it covers servers/*/terraform/modules/*.
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: infra/, framework: terraform, soft_fail: false }
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: servers/, framework: terraform, soft_fail: false }
      - uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, output-file: sbom.cdx.json }
