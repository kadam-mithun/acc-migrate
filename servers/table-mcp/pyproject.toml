[project]
name = "table-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.8",
  "deltalake>=0.20",
  "pyiceberg[glue,s3fs]>=0.8",
  "pyspark==3.5.8",
  "boto3>=1.35",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "xxhash>=3.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/table_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "moto>=5", "pip-audit>=2.7", "pyyaml>=6.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
strict = true
[tool.pytest.ini_options]
markers = ["integration: needs AWS sandbox", "acceptance: needs Databricks fixtures"]
# src layout: import the package from the tree rather than relying on the editable
# install's .pth, which macOS flags as hidden inside .venv and CPython's site.py
# then silently skips.
pythonpath = ["src"]
