# Strategy-matrix oracle for table-mcp unit tests.
#
# ── AUTHORED FROM THE SPEC, NOT GENERATED FROM CODE ──────────────────────────
# PROVENANCE, stated plainly because root rule 5 depends on it:
#   Drafted by Claude Code on 2026-09-21, by transcribing §5 (the strategy matrix, the decision order and the named-warning list) of
#   `SPEC.md` v0.3.2 line by line, on the instruction of the repo owner.
#   NOT captured from `table-mcp` output, NOT round-tripped through the
#   implementation, NOT reconciled against a test run.
#
#   STATUS: **awaiting sign-off.** Until the lead architect (spec owner) has
#   read this file against §5 (the strategy matrix, the decision order and the named-warning list) and approved it in a reviewed PR, treat it
#   as a draft oracle. It is an independent transcription, but it was not
#   written by the human who owns the spec, and root rule 5 is about
#   independence from the code — not about who typed it. See OPEN_QUESTIONS #16.
#
# WHY IT IS NOT GENERATED: golden fixtures are never generated from the code
# under test (root CLAUDE.md rule 5, SPEC §11, Gate 0 #9). `strategy.py` is tested against
# the *specification* — if the implementation drifts these tests fail; if the
# spec changes, a human edits this file first and the implementation follows.
# Regenerating it from `table-mcp` output is a review failure, not a shortcut.
#
# STRUCTURE: one entry per test, keyed by the test name it drives —
#   test_strategy_rule_<id>             one per rule, S1 … S7
#   test_strategy_rule_<id>_<trigger>   one per trigger condition in §5
#   test_strategy_order_<A>_beats_<B>   one per decision-order boundary
# `profile` is a sparse description; everything unstated is a plain table with
# no Delta features (the AT-01 shape). `expect.warnings` is the complete set of
# named warning codes for that decision — an unlisted code must not appear.
# ─────────────────────────────────────────────────────────────────────────────

# ── One per rule ─────────────────────────────────────────────────────────────

test_strategy_rule_S1:
  spec_ref: "§5 row S1 — metadata-only snapshot, zero data copy"
