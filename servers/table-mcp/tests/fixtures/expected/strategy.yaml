# ── Named warnings (§5) ──────────────────────────────────────────────────────

test_strategy_warning_history_truncated:
  spec_ref: "§5/§6: S2 window cut at a vacuumed version"
  profile:
    version_ledger:
      - { version: 0, recoverable: false }
      - { version: 1, recoverable: false }
      - { version: 2, recoverable: true }
  options: { history_days: 90 }
  expect: { strategy: S2, rule_id: S2, warnings: [HISTORY_TRUNCATED] }

test_strategy_warning_cdf_window_truncated:
  spec_ref: "§5: Delta CDF retention shorter than options.cdf_window_days"
  profile:
    change_data_feed: true
    cdf_consumers: ["meridian_fin.gl.journal_rollup"]
    cdf_retention_days: 7
  options: { cdf_window_days: 30 }
  expect: { strategy: S4, rule_id: S4, warnings: [CDF_WINDOW_TRUNCATED] }

test_strategy_warning_type_widened:
  spec_ref: "§5 type table: BYTE/SHORT widen to int; recorded as type_widened"
  profile: { columns: [{ name: flag, type: BYTE }] }
  options: {}
  expect: { strategy: S1, rule_id: S1, warnings: [TYPE_WIDENED] }

test_strategy_warning_length_constraint_dropped:
  spec_ref: "§5 type table: CHAR(n)/VARCHAR(n) lose their length constraint"
